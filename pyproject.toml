[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipumsi"
version = "0.1.0"
description = "Scrape the IPUMS International catalog and drive the IPUMS extract API from it"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
    "pandas>=2.0",
    "pyarrow>=12",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "altair>=5"]
dev = ["pytest>=7"]

[project.scripts]
ipumsi = "ipumsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
